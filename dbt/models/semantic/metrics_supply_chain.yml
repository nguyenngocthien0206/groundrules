# Certified metrics owned by supply chain operations that combine more than
# one semantic model. One owner per file: on GitHub any listed code owner can
# approve a file, so a file shared with another team would let that team
# approve these rules. The simple metrics they build on are hidden and live
# next to their model.
#
# An input that can be empty for a store or a month (no transfers) is wrapped
# in coalesce(..., 0). Without it the whole metric turns null for that row.
# `fill_nulls_with` would be the usual tool, but dbt-core 1.12.6 drops it for
# metrics in the latest YAML spec.
metrics:
  - name: available_stock
    label: Available stock
    description: >
      Base units a store can sell or transfer: on hand in batches with at
      least 90 days to expiry (DR-001), minus stock it has shipped to other
      stores that has not arrived yet (in transit; cancelled transfers are not
      subtracted, DR-003). A stock position at the snapshot date.
    type: derived
    expr: coalesce(available_on_hand_units, 0) - coalesce(outbound_in_transit_units, 0)
    input_metrics:
      - name: available_on_hand_units
      - name: outbound_in_transit_units
    config:
      group: supply_chain_ops
      meta:
        version: 3
        status: certified
        certified_on: 2026-09-10
        recertify_every_days: 180
        decision: decisions/DR-001.md
        replaced_by: null
        agent_notes: >
          Use this for "how much do we have". Never sum on-hand quantities
          directly: they include stock under 90 days to expiry, expired stock
          and stock already shipped to another store. Counted in the SKU's
          base unit (tablet, bottle, piece; DR-007).

  - name: sell_through_rate
    label: Sell-through rate
    description: >
      Base units sold divided by base units received net in the same period:
      received from suppliers and other stores, minus units transferred out.
      Returned units are not subtracted from sales. No value when net
      received is zero or negative (DR-011).
    type: derived
    expr: >
      coalesce(units_sold, 0) * 1.0
      / case when coalesce(units_received, 0) - coalesce(units_transferred_out, 0) > 0
             then coalesce(units_received, 0) - coalesce(units_transferred_out, 0) end
    input_metrics:
      - name: units_sold
      - name: units_received
      - name: units_transferred_out
    config:
      group: supply_chain_ops
      meta:
        version: 2
        status: certified
        certified_on: 2026-10-26
        recertify_every_days: 180
        decision: decisions/DR-011.md
        replaced_by: null
        agent_notes: >
          A ratio, not a percentage. Only meaningful over a period of weeks
          or more; for one day it swings with delivery days. No value means
          the store took in no stock overall: say so, never report 0. A
          new_store caveat means a store's opening stock is in the period but
          its sales are not; do not compare it with established stores.

  - name: units_sold_28d
    description: Base units sold over a rolling 28-day window. Not for direct use; see days_of_cover.
    type: cumulative
    input_metric: units_sold
    window: 28 days
    hidden: true

  - name: days_of_cover
    label: Days of cover
    description: >
      How many days available stock lasts at the recent pace: available stock
      at the snapshot divided by average daily base units sold over the 28
      full days before it. A store that has run out has 0 days; one that sold
      nothing in the 28 days has no value.
    type: derived
    # A store that has run out has no stock row, so available_stock arrives
    # here empty, not 0. Without the coalesce, v1 gave no value instead of 0.
    expr: coalesce(available_stock, 0) / nullif(units_sold_prior_28d / 28.0, 0)
    input_metrics:
      - name: available_stock
      - name: units_sold_28d
        alias: units_sold_prior_28d
        offset_window: 1 day
    config:
      group: supply_chain_ops
      meta:
        version: 2
        status: certified
        certified_on: 2026-10-29
        recertify_every_days: 180
        decision: decisions/DR-010.md
        replaced_by: null
        agent_notes: >
          Ask it at the snapshot date. Stores whose POS sync lags show too
          few recent sales, so their cover looks longer than it is (DR-004).
          0 means the store has run out while it still sells; no value means
          it sold nothing in the 28 days.
