# Marts feed the certified metrics, so their shape is a contract: a renamed
# or retyped column fails the build instead of quietly breaking a metric.
# They hold neutral facts only. Business rules (what counts as available,
# which month a return belongs to, before or after VAT) live in the semantic
# layer, where CODEOWNERS can protect them.
models:
  - name: dim_store
    description: One row per store, with its POS sync state at the snapshot.
    config:
      contract:
        enforced: true
    columns:
      - name: store_code
        data_type: varchar
        description: Store code, for example NW001.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: store_name
        data_type: varchar
        description: Store name.
      - name: district_code
        data_type: varchar
        description: District the store belongs to.
      - name: district_name
        data_type: varchar
        description: District name.
      - name: opened_on
        data_type: date
        description: Date the store opened.
      - name: days_open
        data_type: bigint
        description: Days between opening and the snapshot date.
      - name: is_newly_opened
        data_type: boolean
        description: Opened in the 31 days before the snapshot.
      - name: is_open_24h
        data_type: boolean
        description: Open around the clock.
      - name: pos_vendor
        data_type: varchar
        description: POS vendor, A or B.
      - name: last_synced_at
        data_type: timestamp
        description: Last successful POS sync, local time.
      - name: last_sync_attempt_at
        data_type: timestamp
        description: Last sync attempt, local time.
      - name: last_sync_error
        data_type: varchar
        description: Error of the last attempt, null when it worked.
      - name: pos_data_through
        data_type: date
        description: Last business day whose sales have reached the warehouse.
      - name: pos_lag_days
        data_type: bigint
        description: Business days of sales still missing at the snapshot. 0 for a store synced through the day before.
        data_tests:
          - not_null
      - name: is_pos_sync_lagging
        data_type: boolean
        description: True when any day of sales is missing. Answers that include such a store must say so (DR-004).

  - name: dim_sku
    description: One row per SKU with its units and VAT rate.
    config:
      contract:
        enforced: true
    columns:
      - name: sku_code
        data_type: varchar
        description: ERP item number.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: sku_name
        data_type: varchar
        description: Current name.
      - name: category_code
        data_type: varchar
        description: Category code.
      - name: category_name
        data_type: varchar
        description: Category name.
      - name: base_uom
        data_type: varchar
        description: Base unit all quantities in the marts are counted in.
      - name: purchase_uom
        data_type: varchar
        description: Unit suppliers deliver in.
      - name: purchase_uom_factor
        data_type: integer
        description: Base units in one purchase unit.
      - name: vat_rate
        data_type: decimal(5,4)
        description: VAT rate as a fraction.
      - name: list_price_incl_vat
        data_type: bigint
        description: Shelf price per base unit, VND, VAT included.
      - name: shelf_life_days
        data_type: integer
        description: Shelf life of a fresh lot, days.
      - name: created_on
        data_type: date
        description: Date the SKU was created.
      - name: updated_on
        data_type: date
        description: Date the SKU was last changed.

  - name: fct_inventory_batch
    description: >
      Stock at the snapshot, one row per batch, in base units. On-hand still
      includes stock reserved for transfers in transit and expired stock that
      waits for the monthly write-off.
    config:
      contract:
        enforced: true
    columns:
      - name: batch_id
        data_type: varchar
        description: ERP batch id.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: store_code
        data_type: varchar
        description: Store holding the batch.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_code
      - name: sku_code
        data_type: varchar
        description: ERP item number.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sku')
                field: sku_code
      - name: lot_no
        data_type: varchar
        description: Supplier lot number.
      - name: received_on
        data_type: date
        description: Date the batch arrived at this store.
      - name: expires_on
        data_type: date
        description: Expiry date of the lot.
      - name: days_to_expiry
        data_type: bigint
        description: Days from the snapshot date to expiry. Negative when already expired.
      - name: source_type
        data_type: varchar
        description: purchase_order or transfer.
      - name: source_doc
        data_type: varchar
        description: Purchase order or transfer number.
      - name: on_hand_qty_base
        data_type: integer
        description: Quantity on hand at the snapshot, base units.
      - name: unit_cost_excl_vat
        data_type: decimal(18,4)
        description: Cost of one base unit from this batch, VND, VAT excluded.
      - name: on_hand_value_excl_vat
        data_type: decimal(18,4)
        description: on_hand_qty_base times unit_cost_excl_vat.
      - name: snapshot_date
        data_type: date
        description: Date the stock position refers to.

  - name: fct_transfers
    description: Store to store transfers in base units.
    config:
      contract:
        enforced: true
    columns:
      - name: transfer_no
        data_type: varchar
        description: ERP transfer number.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: sku_code
        data_type: varchar
        description: ERP item number.
      - name: lot_no
        data_type: varchar
        description: Lot being transferred.
      - name: from_store_code
        data_type: varchar
        description: Sending store. Its on-hand still holds the stock until delivery.
      - name: to_store_code
        data_type: varchar
        description: Receiving store.
      - name: qty_base
        data_type: integer
        description: Quantity in base units.
      - name: transfer_status
        data_type: varchar
        description: in_transit, delivered or cancelled.
        data_tests:
          - accepted_values:
              arguments:
                values: ["in_transit", "delivered", "cancelled"]
      - name: created_on
        data_type: date
        description: Date the transfer was created.
      - name: shipped_on
        data_type: date
        description: Date the stock left the sending store. Set for cancelled transfers too.
      - name: received_on
        data_type: date
        description: Date of delivery. Null unless delivered.
      - name: updated_on
        data_type: date
        description: Date of the last status change.

  - name: fct_sales
    description: One row per sales line from both POS vendors, retries removed, base units, with and without VAT.
    config:
      contract:
        enforced: true
    columns:
      - name: sales_line_id
        data_type: varchar
        description: Vendor, receipt and line number joined.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: pos_vendor
        data_type: varchar
        description: POS vendor, A or B.
      - name: receipt_no
        data_type: varchar
        description: Receipt number. Not unique per SKU, a receipt can hold the same SKU twice.
      - name: line_no
        data_type: integer
        description: Line number within the receipt.
      - name: store_code
        data_type: varchar
        description: Store code.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_code
      - name: sku_code
        data_type: varchar
        description: ERP item number.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sku')
                field: sku_code
      - name: business_date
        data_type: date
        description: Local date of the sale.
      - name: sold_at
        data_type: timestamp
        description: Local time of the sale.
      - name: uom_code
        data_type: varchar
        description: Unit sold.
      - name: qty
        data_type: integer
        description: Quantity in uom_code.
      - name: qty_base
        data_type: integer
        description: Quantity in base units.
      - name: vat_rate
        data_type: decimal(5,4)
        description: VAT rate as a fraction.
      - name: unit_price_incl_vat
        data_type: bigint
        description: Shelf price of one uom_code, VAT included.
      - name: gross_incl_vat
        data_type: bigint
        description: Before discount, VAT included.
      - name: discount_incl_vat
        data_type: bigint
        description: Discount, VAT included.
      - name: amount_incl_vat
        data_type: bigint
        description: Paid, VAT included.
      - name: gross_excl_vat
        data_type: decimal(18,4)
        description: Before discount, VAT excluded.
      - name: discount_excl_vat
        data_type: decimal(18,4)
        description: Discount, VAT excluded.
      - name: amount_excl_vat
        data_type: decimal(18,4)
        description: Paid, VAT excluded.

  - name: fct_returns
    description: One row per returned item, with the return date and the original sale date when known.
    config:
      contract:
        enforced: true
    columns:
      - name: return_line_id
        data_type: varchar
        description: Return id and line number joined.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: return_id
        data_type: varchar
        description: Returns system id.
      - name: line_no
        data_type: integer
        description: Position within the return.
      - name: store_code
        data_type: varchar
        description: Store where the item came back.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_code
      - name: sku_code
        data_type: varchar
        description: ERP item number.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sku')
                field: sku_code
      - name: return_date
        data_type: date
        description: Local date of the return.
      - name: returned_at
        data_type: timestamp
        description: Local time of the return.
      - name: original_receipt_no
        data_type: varchar
        description: Receipt of the original sale, null when the customer had none.
      - name: sale_business_date
        data_type: date
        description: Business date of the original sale, null when it is not in the extract.
      - name: has_matching_sale
        data_type: boolean
        description: True when the original sale was found.
      - name: uom_code
        data_type: varchar
        description: Unit returned.
      - name: qty
        data_type: integer
        description: Quantity in uom_code.
      - name: qty_base
        data_type: integer
        description: Quantity in base units.
      - name: vat_rate
        data_type: decimal(5,4)
        description: VAT rate as a fraction.
      - name: refund_incl_vat
        data_type: bigint
        description: Refunded, VAT included.
      - name: refund_excl_vat
        data_type: decimal(18,4)
        description: Refunded, VAT excluded.
      - name: return_reason
        data_type: varchar
        description: Reason code.

  - name: fct_goods_received
    description: >
      Stock received by each store, one row per batch, from suppliers or from
      other stores. Includes the opening stock received before the sales window.
    config:
      contract:
        enforced: true
    columns:
      - name: goods_received_id
        data_type: varchar
        description: ERP batch id of the receipt.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: store_code
        data_type: varchar
        description: Receiving store.
      - name: sku_code
        data_type: varchar
        description: ERP item number.
      - name: lot_no
        data_type: varchar
        description: Supplier lot number.
      - name: received_on
        data_type: date
        description: Date received.
      - name: source_type
        data_type: varchar
        description: purchase_order or transfer.
        data_tests:
          - accepted_values:
              arguments:
                values: ["purchase_order", "transfer"]
      - name: source_doc
        data_type: varchar
        description: Purchase order or transfer number.
      - name: qty_base
        data_type: integer
        description: Quantity received in base units.
      - name: unit_cost_excl_vat
        data_type: decimal(18,4)
        description: Cost of one base unit, VND, VAT excluded.
      - name: received_value_excl_vat
        data_type: decimal(18,4)
        description: Cost of the whole receipt, VAT excluded.
