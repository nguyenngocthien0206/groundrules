# What already reads the data, declared the way a company catalogs it. Each
# legacy dashboard computes "net revenue" its own way (rebuilt in legacy/ to
# show the conflict); the Power BI report reads certified exports only.
# `make affected` lists the exposures a change touches, for the pull request
# template.
exposures:
  - name: groundrules_powerbi_report
    label: Groundrules Power BI report
    type: dashboard
    maturity: medium
    url: dashboards/groundrules.pbip
    description: >
      Revenue, margin, stock and sell-through for managers. Every number is a
      dbt saved query exported by MetricFlow (`make dashboard-data`); the
      Power BI model only displays it, and the governance lint checks that.
    owner:
      name: Data platform
      email: data-platform@example.com
    depends_on:
      - metric('net_revenue')
      - metric('gross_margin')
      - metric('sell_through_rate')
      - metric('available_stock')
      - metric('near_expiry_value')
      - metric('days_of_cover')


  - name: finance_dashboard
    label: Finance monthly dashboard (legacy)
    type: dashboard
    maturity: low
    url: legacy/finance_dashboard.sql
    description: >
      Monthly revenue for the finance team. Counts returns in the month of the
      original sale, so closed months keep moving. Superseded by net_revenue
      (DR-002).
    owner:
      name: Finance
      email: finance@example.com
    depends_on:
      - ref('fct_sales')
      - ref('fct_returns')
    config:
      meta:
        replaced_by_metric: net_revenue

  - name: sales_dashboard
    label: Store sales dashboard (legacy)
    type: dashboard
    maturity: low
    url: legacy/sales_dashboard.sql
    description: >
      Daily and monthly sales for store managers. Ignores returns entirely,
      so it overstates revenue. Superseded by net_revenue (DR-002, DR-005).
    owner:
      name: Retail operations
      email: retail-operations@example.com
    depends_on:
      - ref('fct_sales')
    config:
      meta:
        replaced_by_metric: net_revenue

  - name: ops_weekly_report
    label: Operations weekly report (legacy)
    type: analysis
    maturity: low
    url: legacy/ops_weekly_report.sql
    description: >
      Weekly stock and sales review for operations. Reports revenue as the
      tills show it, VAT included, and reads stock from batches as they are,
      without the 90-day line. Superseded by net_revenue (DR-006) and
      available_stock (DR-001).
    owner:
      name: Supply chain operations
      email: supply-chain-ops@example.com
    depends_on:
      - ref('fct_sales')
      - ref('fct_returns')
      - ref('fct_inventory_batch')
    config:
      meta:
        replaced_by_metric: net_revenue
