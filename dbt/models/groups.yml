# Owning teams. A metric's group is its business owner, the team that
# decides what the number means. A mart's group is its data owner, the team
# that keeps the data right. Team handles only, never a person's name.
#
# `github_team` is the one place a team's code review handle lives. The
# governance lint checks .github/CODEOWNERS against it, so a file holding a
# metric is always reviewed by the metric's owner.
groups:
  - name: supply_chain_ops
    owner:
      name: Supply chain operations
      email: supply-chain-ops@example.com
    config:
      meta:
        github_team: "@your-org/supply-chain-ops"
  - name: finance
    owner:
      name: Finance
      email: finance@example.com
    config:
      meta:
        github_team: "@your-org/finance"
  - name: retail_operations
    owner:
      name: Retail operations
      email: retail-operations@example.com
    config:
      meta:
        github_team: "@your-org/retail-operations"
  - name: data_platform
    owner:
      name: Data platform
      email: data-platform@example.com
    config:
      meta:
        github_team: "@your-org/data-platform"
