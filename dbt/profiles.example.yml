# Copy the block for your warehouse into profiles.yml (or ~/.dbt/profiles.yml)
# and install its adapter, for example `uv add dbt-snowflake`.
#
# On a warehouse, the raw extracts are tables your loader already fills, not
# files. Point the sources at those tables and adapt the staging models that
# depend on how data lands (nested returns JSON, the POS file name column):
# adoption/warehouses.md lists every change. Marts and metrics run unchanged.
groundrules:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: groundrules.duckdb
      threads: 4

