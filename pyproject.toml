[project]
name = "groundrules"
version = "0.3.0"
description = "Write down the rules your senior analyst never did, so your AI agent can follow them."
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "dbt-metricflow[dbt-duckdb]==0.15.0",
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pyarrow==26.0.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]
eval-api = [
    "anthropic==1.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["example", "golden", "golden/reference", "governance", "demos", "dashboards", "mcp_server", "agent_eval"]
addopts = "-q"
