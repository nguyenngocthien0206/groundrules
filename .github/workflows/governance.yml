# Every promise the repo makes, checked on every pull request: the data
# builds, every metric has an owner, a record and golden questions, the
# golden questions pass, the registry is current, the demos still make their
# point. Steps call the same make targets people run locally.
#
# Make this a required status check, together with "Require review from Code
# Owners", in branch protection (see adoption/existing-dbt-project.md).
name: governance

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, with the real date: a metric past its recertification date turns
  # this run red, so its owner hears about it without blocking anyone's PR.
  schedule:
    - cron: "0 1 * * 1"  # Monday 08:00 in Vietnam
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # make affected diffs against the base branch

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Generate the synthetic extracts
        run: make data

      - name: Build dbt (models, unit tests, data tests, freshness)
        run: make build

      - name: Governance lint, as of today
        env:
          # Overdue recertification fails the weekly run only.
          STALE: ${{ github.event_name == 'schedule' && '--fail-on-stale' || '' }}
        run: |
          set +e
          make lint LINT_ARGS="--today $(date -u +%F) $STALE" 2>&1 | tee "$RUNNER_TEMP/lint.txt"
          status=${PIPESTATUS[0]}
          { echo "### Governance lint"; echo '```'; grep -E "^(ERROR|WARNING)|checked as of" "$RUNNER_TEMP/lint.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Registry is committed and current
        run: |
          make registry
          git diff --exit-code governance/registry.md

      - name: Metrics and exposures this pull request touches
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          { echo "### Affected"; echo '```'; make -s affected BASE="origin/$BASE_REF"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Golden questions
        run: make golden

      - name: Keep the golden question report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: golden-report
          path: golden/report/junit.xml
          if-no-files-found: ignore

      - name: Export the dashboard's saved queries
        run: make dashboard-data

      - name: Tests (including the generator checksum)
        run: uv run pytest

      - name: Demos still make their point
        run: |
          make demo-conflict
          make demo-drift
          git diff --exit-code  # the drift demo must restore the rule file

      - name: dbt v2 parser still parses the project
        run: make check-v2
